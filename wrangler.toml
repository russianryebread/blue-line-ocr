name = "blue-line-ocr"
main = "src/server/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Vite writes the fresh Vue client here. API requests fall through to the Worker.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Existing project variables, preserved from the original configuration.
[vars]
LOG_LEVEL = "debug"
VISION_MODEL = "@cf/meta/llama-3.2-11b-vision-instruct"
# Optional external historical-artifact endpoint.
HISTORICAL_API_URL = ""

# Existing Workers AI binding. The OCR pipeline reads VISION_MODEL from env.
[ai]
binding = "AI"

# Existing D1 database and ID.
[[d1_databases]]
binding = "DB"
database_name = "hockey-scorecards"
database_id = "d3b35bca-773a-4b6e-82f2-39553d01eb41"
migrations_dir = "migrations"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
