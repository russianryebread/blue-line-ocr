name = "blue-line-ocr"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Serves everything in ./public directly (index.html, app.js, style.css).
# Requests that don't match a static file (e.g. /api/*) fall through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
LOG_LEVEL = "debug"
VISION_MODEL = "kimi-k3"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "hockey-scorecards"
# Replace with the ID printed by: wrangler d1 create hockey-scorecards
database_id = "d3b35bca-773a-4b6e-82f2-39553d01eb41"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
